<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin dashboard')}"></head>
<body>
<div class="admin-wrap">
    <aside th:replace="~{fragments :: adminSidebar('dashboard')}"></aside>
    <main class="admin-main">
        <h1 class="h3 page-title">Dashboard</h1>
        <p class="text-muted">Live figures from the complaints database.</p>
        <div th:replace="~{fragments :: flash}"></div>
        <div class="row g-3 mb-4">
            <div class="col-6 col-xl-3"><div class="cf-card stat-card"><div class="stat-icon navy"><i class="bi bi-collection"></i></div><div><div class="stat-number" th:text="${stats.total()}">0</div><div class="stat-label">Total</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="cf-card stat-card"><div class="stat-icon amber"><i class="bi bi-hourglass-split"></i></div><div><div class="stat-number" th:text="${stats.pending()}">0</div><div class="stat-label">Pending</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="cf-card stat-card"><div class="stat-icon"><i class="bi bi-wrench-adjustable"></i></div><div><div class="stat-number" th:text="${stats.inProgress()}">0</div><div class="stat-label">In progress</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="cf-card stat-card"><div class="stat-icon green"><i class="bi bi-check2-circle"></i></div><div><div class="stat-number" th:text="${stats.resolved()}">0</div><div class="stat-label">Resolved</div></div></div></div>
        </div>
        <div class="row g-3">
            <div class="col-lg-5">
                <div class="cf-card p-4 h-100">
                    <h2 class="h5 page-title">Complaints by category</h2>
                    <div class="mb-3" th:each="e : ${categoryStats}">
                        <div class="d-flex justify-content-between small mb-1"><span th:text="${e.key.label}">Category</span><strong th:text="${e.value}">0</strong></div>
                        <div class="progress" role="progressbar" th:aria-valuenow="${e.value}" aria-valuemin="0" th:aria-valuemax="${stats.total()}">
                            <div class="progress-bar" th:style="'width:' + ${stats.total() > 0 ? e.value * 100 / stats.total() : 0} + '%'"></div>
                        </div>
                    </div>
                    <p class="small text-muted mb-0">Rejected: <span th:text="${stats.rejected()}">0</span> &middot; Staff members: <span th:text="${staffCount}">0</span></p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="cf-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h2 class="h5 page-title mb-0">Recent complaints</h2>
                        <a th:href="@{/admin/complaints}">Manage all</a>
                    </div>
                    <div th:replace="~{fragments :: complaintTable(${recent}, true)}"></div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
