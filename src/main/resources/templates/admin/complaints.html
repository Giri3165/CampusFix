<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage complaints')}"></head>
<body>
<div class="admin-wrap">
    <aside th:replace="~{fragments :: adminSidebar('complaints')}"></aside>
    <main class="admin-main">
        <h1 class="h3 page-title">Manage complaints</h1>
        <p class="text-muted">Open a complaint to assign staff, change its status and add remarks.</p>
        <div th:replace="~{fragments :: flash}"></div>
        <form th:replace="~{fragments :: filters('/admin/complaints')}"></form>
        <div class="cf-card p-3">
            <div th:replace="~{fragments :: complaintTable(${page.content}, true)}"></div>
        </div>
        <nav th:replace="~{fragments :: pager(${page}, '/admin/complaints')}"></nav>
    </main>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
