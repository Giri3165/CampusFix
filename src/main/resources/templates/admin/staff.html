<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Maintenance staff')}"></head>
<body>
<div class="admin-wrap">
    <aside th:replace="~{fragments :: adminSidebar('staff')}"></aside>
    <main class="admin-main">
        <h1 class="h3 page-title">Maintenance staff</h1>
        <p class="text-muted">Add the people complaints can be assigned to.</p>
        <div th:replace="~{fragments :: flash}"></div>
        <div class="row g-3">
            <div class="col-lg-4">
                <form class="cf-card p-4" th:action="@{/admin/staff}" th:object="${staffForm}" method="post" novalidate>
                    <h2 class="h5 page-title">Add staff member</h2>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input id="phone" type="text" class="form-control" th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="specialization" class="form-label">Specialization</label>
                        <input id="specialization" type="text" class="form-control" th:field="*{specialization}" placeholder="Electrician, Plumber, Network..." th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{specialization}"></div>
                    </div>
                    <button type="submit" class="btn btn-teal w-100">Add staff member</button>
                </form>
            </div>
            <div class="col-lg-8">
                <div class="cf-card p-3">
                    <div class="table-responsive">
                        <table class="table cf-table mb-0">
                            <thead><tr><th>Name</th><th>Phone</th><th>Specialization</th><th></th></tr></thead>
                            <tbody>
                            <tr th:each="s : ${staffList}">
                                <td th:text="${s.name}">Name</td>
                                <td th:text="${s.phone}">Phone</td>
                                <td th:text="${s.specialization}">Specialization</td>
                                <td class="text-end">
                                    <form th:action="@{/admin/staff/{id}/delete(id=${s.id})}" method="post" onsubmit="return confirm('Remove this staff member?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(staffList)}"><td colspan="4" class="text-center text-muted py-4">No staff yet. Add the first member using the form.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
