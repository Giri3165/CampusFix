spring.application.name=CampusFix
server.port=${PORT:8080}

# ---- Database (override with environment variables; no secrets in Git) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusfix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---- Uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---- First-run administrator (created only if no admin exists) ----
app.admin.email=${ADMIN_EMAIL:admin@campusfix.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@123}

# ---- Misc ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
server.servlet.session.timeout=30m
server.error.include-message=always
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
