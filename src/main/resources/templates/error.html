<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Something went wrong')}"></head>
<body>
<main class="auth-wrap">
    <div class="cf-card auth-card text-center">
        <p class="display-4 fw-bold text-muted mb-0" th:text="${status}">500</p>
        <h1 class="h4 page-title" th:text="${error}">Error</h1>
        <p class="text-muted" th:text="${message}">An unexpected error occurred.</p>
        <a class="btn btn-teal" th:href="@{/dashboard}">Back to dashboard</a>
    </div>
</main>
</body>
</html>
