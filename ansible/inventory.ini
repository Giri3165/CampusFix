# Static inventory (Unit IV).  Replace the placeholders, then test with:
#   ansible -i inventory.ini campusfix -m ping
[campusfix]
campusfix-vm ansible_host=<AZURE_VM_PUBLIC_IP> ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/campusfix_azure.pem

[campusfix:vars]
ansible_python_interpreter=/usr/bin/python3
