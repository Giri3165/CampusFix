---
- name: Create the service group
  ansible.builtin.group:
    name: "{{ app_user }}"
    system: true

- name: Create the service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_dir }}", mode: "0755" }
    - { path: "{{ upload_dir }}", mode: "0750" }
    - { path: "{{ env_dir }}", mode: "0750" }

- name: Copy the application JAR
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ app_dir }}/campusfix.jar"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart campusfix

- name: Write the environment file (holds secrets, readable only by the service user)
  ansible.builtin.template:
    src: campusfix.env.j2
    dest: "{{ env_dir }}/campusfix.env"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  no_log: true
  notify: Restart campusfix

- name: Install the systemd unit
  ansible.builtin.template:
    src: campusfix.service.j2
    dest: /etc/systemd/system/campusfix.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart campusfix

- name: Enable and start the service
  ansible.builtin.systemd:
    name: campusfix
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait for the application port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    delay: 5
    timeout: 120

- name: Smoke test - health endpoint must report UP
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/actuator/health"
    return_content: true
  register: health
  retries: 12
  delay: 5
  until: health.status == 200 and "UP" in health.content
