<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${editing} ? 'Edit complaint' : 'Submit complaint')}"></head>
<body>
<nav th:replace="~{fragments :: studentNav('new')}"></nav>
<main class="container py-4" style="max-width: 820px;">
    <h1 class="h3 page-title mb-1" th:text="${editing} ? 'Edit complaint' : 'Submit a complaint'">Submit a complaint</h1>
    <p class="text-muted">Give enough detail for the maintenance team to find and fix the problem.</p>
    <div th:replace="~{fragments :: flash}"></div>
    <form class="cf-card p-4" th:action="@{${formAction}}" th:object="${complaintForm}" method="post" enctype="multipart/form-data" novalidate>
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" class="form-control" th:field="*{title}" placeholder="e.g. Ceiling fan not working" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" rows="4" class="form-control" th:field="*{description}" placeholder="What is wrong, since when, and how does it affect you?" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="category" class="form-label">Category</label>
                <select id="category" class="form-select" th:field="*{category}" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                    <option value="">Select a category</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{category}"></div>
            </div>
            <div class="col-md-6">
                <label for="priority" class="form-label">Priority</label>
                <select id="priority" class="form-select" th:field="*{priority}" th:classappend="${#fields.hasErrors('priority')} ? 'is-invalid'">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.label}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{priority}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" id="location" class="form-control" th:field="*{location}" placeholder="Building, block, classroom or lab (e.g. Block B, Room 204)" th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{location}"></div>
        </div>
        <div class="mb-4">
            <label for="image" class="form-label">Photo <span class="text-muted">(optional, JPG, PNG or GIF, up to 5 MB)</span></label>
            <input type="file" id="image" name="image" class="form-control" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif">
            <img id="preview" class="img-fluid rounded mt-3 d-none complaint-img" alt="Selected image preview">
            <div class="mt-3" th:if="${editing and complaint != null and complaint.imagePath != null}">
                <p class="small text-muted mb-1">Current photo (upload a new one to replace it):</p>
                <img class="img-fluid rounded complaint-img" th:src="@{'/uploads/' + ${complaint.imagePath}}" alt="Current complaint photo">
            </div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-teal" th:text="${editing} ? 'Save changes' : 'Submit complaint'">Submit complaint</button>
            <a class="btn btn-outline-secondary" th:href="@{/student/complaints}">Cancel</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
