<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<main class="auth-wrap">
    <div class="cf-card auth-card">
        <a class="brand brand-dark d-block text-center mb-1" th:href="@{/}"><i class="bi bi-tools"></i> Campus<span>Fix</span></a>
        <h1 class="h4 text-center page-title mb-4">Log in to your account</h1>
        <div th:replace="~{fragments :: flash}"></div>
        <div class="alert alert-danger" th:if="${param.error}">Email or password is incorrect.</div>
        <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
        <form th:action="@{/login}" method="post" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-teal w-100" type="submit">Log in</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0">Students and administrators use the same form. New student? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
