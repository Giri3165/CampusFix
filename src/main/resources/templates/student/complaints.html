<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My complaints')}"></head>
<body>
<nav th:replace="~{fragments :: studentNav('list')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 page-title mb-0">My complaints</h1>
        <a class="btn btn-teal" th:href="@{/student/complaints/new}"><i class="bi bi-plus-circle"></i> Submit complaint</a>
    </div>
    <div th:replace="~{fragments :: flash}"></div>
    <form th:replace="~{fragments :: filters('/student/complaints')}"></form>
    <div class="cf-card p-3">
        <div th:replace="~{fragments :: complaintTable(${page.content}, false)}"></div>
    </div>
    <nav th:replace="~{fragments :: pager(${page}, '/student/complaints')}"></nav>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
